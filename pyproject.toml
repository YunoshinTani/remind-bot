[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "class-diary-remind-bot"
version = "0.1.0"
description = "Discord クラス日誌リマインダー"
requires-python = ">=3.11"
dependencies = [
  "discord.py>=2.7.1,<3",
  "python-dotenv>=1,<2",
  "tzdata>=2025.2",
]

[project.optional-dependencies]
dev = ["pyright==1.1.414"]

[project.scripts]
remind-bot = "remind_bot.__main__:main"

[tool.setuptools.packages.find]
include = ["remind_bot*"]

[tool.pyright]
include = ["remind_bot", "deployment", "tests"]
exclude = ["**/__pycache__"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
